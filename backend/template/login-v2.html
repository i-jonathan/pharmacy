<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f7" />
    <title>Sign in | Primocrest Pharmacy</title>
    <link href="/static/css/tailwind.css" rel="stylesheet" />
    <style>
      :root { color-scheme: light; font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      html.dark { color-scheme: dark; }
      body { min-height: 100vh; min-height: 100dvh; }
      .login-field:focus-visible { outline: 3px solid rgb(21 128 61 / 24%); outline-offset: 1px; border-color: #15803d; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body class="min-h-screen bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
    <div id="login-app" data-csrf-token="{{ .CSRFToken }}" data-login-error="{{ .LoginError }}"></div>
    <script type="module" src="{{ ViteAsset "src/login/main.js" }}"></script>
  </body>
</html>
